#CI项目
name: CWRT-ALL

#CI计划
on:
  #自动编译：每周一早上5点
  schedule:
    - cron: 0 21 * * 0
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

#CI权限
permissions: write-all

#CI任务
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          # 保留最近 1 个 release：万一新固件有问题，还能回退到上一版
          # （原上游是 0，即每次编译前把旧 release 全删掉）
          releases_keep_latest: 1
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0

  config:
    needs: cleanup
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      #max-parallel: 4
      matrix:
        # 只编 GL-MT3600BE：MT7987 + 联发科闭源 WiFi7 驱动
        # 上游原版这两行是 CONFIG: [MT7981, MT7986] + Yuzhii0718 的 24.10 源码，
        # 且 chasey-dev 那行是注释掉的，所以直接 fork 编不出 MT3600BE。
        CONFIG: [MT7987]
        REPO_INFO:
          - {SOURCE: "chasey-dev/immortalwrt-mt798x-rebase", BRANCH: "25.12-dev-wifi7"}

    #调用公用编译核心WRT-CORE.yml
    #注意：跑完之后 .github/workflows/clean-release-assets.yml 会自动删掉
    #      release 里的 BL2/FIP 等引导文件，只留固件/manifest/配置
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: CWRT
      #默认WIFI名称
      WRT_SSID: CWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.REPO_INFO.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.REPO_INFO.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.REPO_INFO.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
